<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>QRAMS Quiz</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <style>
    /* ===========================================================================
       QRAMS QUIZ PLAYER — the page a pupil lands on after scanning a QR code.
       Standalone on purpose: no Bootstrap, no login, big tap targets, fast.
       It talks to the backend with two public calls:  ?play=<token>  and
       ?finish=<token>&a=A,B,…  (grading happens on the SERVER, so the correct
       answers are never inside this page until the pupil has submitted).
       =========================================================================== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, 'Segoe UI', Roboto, Arial, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #0e1d3c 0%, #123a6b 55%, #0e7490 100%);
      padding: 16px; color: #0f172a;
    }
    .card {
      width: 100%; max-width: 560px; background: #ffffff; border-radius: 24px;
      padding: 26px 22px; box-shadow: 0 24px 60px rgba(2, 6, 23, .45);
    }
    .center { text-align: center; }
    .muted { color: #64748b; font-size: .95rem; }
    .spin {
      width: 44px; height: 44px; border: 5px solid #e2e8f0; border-top-color: #0ea5e9;
      border-radius: 50%; margin: 18px auto; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hello { font-size: 1.05rem; font-weight: 700; color: #0ea5e9; }
    .title { font-size: 1.25rem; font-weight: 800; margin: 4px 0 2px; }

    .bar { height: 12px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin: 16px 0 4px; }
    .bar > div { height: 100%; width: 0%; border-radius: 99px;
      background: linear-gradient(90deg, #0ea5e9, #6366f1); transition: width .35s ease; }
    .step { font-size: .85rem; color: #64748b; text-align: right; margin-bottom: 10px; }

    .q { font-size: 1.25rem; font-weight: 800; line-height: 1.45; margin: 10px 0 18px; }
    .opt {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 16px;
      padding: 14px 16px; margin-bottom: 12px; font-size: 1.05rem; font-weight: 600;
      color: #0f172a; cursor: pointer; transition: all .15s ease;
    }
    .opt .tag {
      flex: 0 0 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
      background: #e0f2fe; color: #0369a1; font-weight: 800;
    }
    .opt:active { transform: scale(.985); }
    .opt.sel { border-color: #0ea5e9; background: #e0f2fe; }
    .opt.sel .tag { background: #0ea5e9; color: #fff; }

    .btn {
      display: block; width: 100%; border: 0; border-radius: 16px; padding: 15px;
      font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-top: 6px;
      background: linear-gradient(90deg, #0ea5e9, #6366f1); color: #fff;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .big { font-size: 3.4rem; }
    .score { font-size: 3rem; font-weight: 900; color: #0ea5e9; margin: 6px 0; }
    .stars { font-size: 2.2rem; letter-spacing: .1em; margin: 4px 0 10px; }
    .pts {
      display: inline-block; background: #ecfdf5; color: #047857; border: 2px solid #6ee7b7;
      border-radius: 99px; padding: 6px 18px; font-weight: 800; margin-bottom: 14px;
    }
    .note {
      background: #fffbeb; border: 1px solid #fcd34d; color: #92400e;
      border-radius: 12px; padding: 10px 14px; font-size: .9rem; margin: 12px 0;
    }
    .review { text-align: left; margin-top: 16px; border-top: 2px dashed #e2e8f0; padding-top: 12px; }
    .review h3 { font-size: 1rem; margin-bottom: 8px; }
    .rev { display: flex; gap: 10px; align-items: baseline; padding: 7px 4px; font-size: .95rem;
      border-bottom: 1px solid #f1f5f9; }
    .rev .ok { color: #16a34a; font-weight: 800; }
    .rev .bad { color: #dc2626; font-weight: 800; }
    .rev .fix { color: #16a34a; font-weight: 700; }
    .foot { margin-top: 16px; font-size: .78rem; color: #94a3b8; text-align: center; }

    /* --- typed activities (Bloom phase) --- */
    .bloom { display: inline-block; font-size: .72rem; font-weight: 800; padding: 3px 10px;
      border-radius: 99px; margin-bottom: 6px; color: #fff; letter-spacing: .03em; }
    .fillin { display: inline-block; width: 7.5em; margin: 0 4px; padding: 6px 10px;
      border: 2px solid #94a3b8; border-radius: 10px; font: inherit; font-weight: 700; color: #0f172a; }
    .fillin:focus { outline: none; border-color: #0ea5e9; background: #f0f9ff; }
    .mwrap { display: flex; gap: 10px; }
    .mcol { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .mitem { border: 2px solid #e2e8f0; background: #f8fafc; border-radius: 12px; padding: 10px 8px;
      font-size: .95rem; font-weight: 600; cursor: pointer; text-align: center; color: #0f172a; }
    .mitem.sel { border-color: #0ea5e9; background: #bae6fd; }
    .mitem.p0 { border-color: #0ea5e9; background: #e0f2fe; }
    .mitem.p1 { border-color: #a78bfa; background: #f3e8ff; }
    .mitem.p2 { border-color: #34d399; background: #ecfdf5; }
    .mitem.p3 { border-color: #fbbf24; background: #fffbeb; }
    .oitem { display: flex; align-items: center; gap: 8px; border: 2px solid #e2e8f0; background: #f8fafc;
      border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; font-weight: 600; }
    .oitem .num { flex: 0 0 26px; height: 26px; border-radius: 8px; background: #e0f2fe; color: #0369a1;
      display: grid; place-items: center; font-weight: 800; font-size: .85rem; }
    .oitem .txt { flex: 1; min-width: 0; }
    .obtn { border: 0; background: #e2e8f0; border-radius: 8px; width: 36px; height: 32px;
      font-weight: 800; cursor: pointer; color: #0f172a; font-size: 1rem; }
    .obtn:disabled { opacity: .35; }
    .oanswer { width: 100%; border: 2px solid #cbd5e1; border-radius: 12px; padding: 12px;
      font: inherit; resize: vertical; min-height: 100px; color: #0f172a; }
    .oanswer:focus { outline: none; border-color: #0ea5e9; background: #f0f9ff; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="center">
      <div class="big">📱</div>
      <div class="title">Loading your task…</div>
      <div class="spin"></div>
      <div class="muted">Just a moment</div>
    </div>
  </div>

  <!-- Shared connection config (gives us the backend /exec URL). -->
  <script src="./js/config.js"></script>
  <script>
    /* ----------------------------- tiny helpers ----------------------------- */
    const card = document.getElementById('card');
    const esc = (s) => String(s == null ? '' : s)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#39;');
    const API = QRAMS.getApiUrl();
    const token = new URLSearchParams(location.search).get('t') || '';

    const LETTERS = ['A', 'B', 'C', 'D'];
    let quiz = null;        // the playInfo response
    let current = 0;        // which question is showing
    let picked = [];        // chosen letter per question

    function fail(msg) {
      card.innerHTML = `<div class="center"><div class="big">😕</div>
        <div class="title">Oops</div>
        <p class="muted" style="margin:8px 0 0">${esc(msg)}</p>
        <p class="muted" style="margin-top:10px">Please tell your teacher.</p></div>`;
    }

    /* ------------------------------- 1. load ------------------------------- */
    async function load() {
      if (!token) return fail('No quiz code in this link.');
      if (!API) return fail('The app is not connected yet.');
      let r;
      try {
        const res = await fetch(API + '?play=' + encodeURIComponent(token) +
          '&ua=' + encodeURIComponent(navigator.userAgent.slice(0, 200)));
        r = await res.json();
      } catch (e) { return fail('Could not reach the server. Check your internet and try again.'); }
      if (!r.ok) return fail(r.error || 'Something went wrong.');
      const d = r.data;

      if (d.kind === 'redirect' && d.url) { location.replace(d.url); return; }
      if (d.kind !== 'quiz') return fail(d.message || 'This code is not recognised.');

      quiz = d;
      picked = freshPicked(); // one answer slot per question, shaped by its activity type
      showQuestion();
    }

    /** Build a blank answer slot for each question, shaped to its activity type. */
    function freshPicked() {
      return quiz.questions.map(q => {
        if (q.type === 'fill') return new Array(q.blanks || 1).fill('');
        if (q.type === 'match') return new Array((q.left || []).length).fill('');
        if (q.type === 'order') return (q.items || []).slice();
        if (q.type === 'tf') return { pick: '', why: '' };
        return ''; // mcq letter / open text
      });
    }

    /* --------------------------- 2. one question --------------------------- */
    const BLOOM_COLORS = { Remember: '#0ea5e9', Understand: '#10b981', Apply: '#f59e0b',
                           Analyze: '#fb923c', Evaluate: '#ec4899', Create: '#8b5cf6' };
    let mSel = -1; // matching: which LEFT item is selected

    /** Can the pupil move on? (every part of the answer filled in) */
    function canGoNext(q, val) {
      if (q.type === 'fill') return val.every(v => String(v).trim() !== '');
      if (q.type === 'match') return val.every(v => v !== '');
      if (q.type === 'order') return true;
      if (q.type === 'open') return String(val).trim() !== '';
      if (q.type === 'tf') return !!val.pick && (!q.explain || String(val.why || '').trim() !== '');
      return !!val;
    }

    /** Optional image/audio shown above any question. */
    function mediaHtml(q) {
      let h = '';
      if (q.image) h += `<img src="${esc(q.image)}" alt="" style="max-width:100%;border-radius:14px;margin:0 0 12px;display:block">`;
      if (q.audio) h += `<audio controls src="${esc(q.audio)}" style="width:100%;margin:0 0 12px"></audio>`;
      return h;
    }

    /** The activity-specific part of the question card. */
    function bodyHtml(q, i) {
      const val = picked[i];
      if (q.type === 'fill') {
        // The question text contains ___ for each blank → swap them for inputs.
        const parts = q.question.split('___');
        let bi = 0, html = '<div class="q" style="line-height:2.3">';
        parts.forEach((seg, k) => {
          html += esc(seg);
          if (k < parts.length - 1) { html += `<input class="fillin" data-b="${bi}" value="${esc(val[bi] || '')}" autocomplete="off">`; bi++; }
        });
        return html + '</div>';
      }
      if (q.type === 'match') {
        return `<div class="q">${esc(q.question)}</div>
          <p class="muted" style="margin-bottom:10px">Tap an item on the LEFT, then its partner on the RIGHT. Tap a left item twice to clear it.</p>
          <div class="mwrap">
            <div class="mcol">${q.left.map((t, li) => {
              const cls = li === mSel ? ' sel' : (val[li] !== '' ? ' p' + (li % 4) : '');
              return `<button class="mitem${cls}" data-side="l" data-i="${li}">${esc(t)}${val[li] ? `<div style="font-size:.74rem;font-weight:700;opacity:.75">⟶ ${esc(val[li])}</div>` : ''}</button>`;
            }).join('')}</div>
            <div class="mcol">${q.right.map(t => {
              const li = val.indexOf(t);
              return `<button class="mitem${li >= 0 ? ' p' + (li % 4) : ''}" data-side="r" data-t="${esc(t)}">${esc(t)}</button>`;
            }).join('')}</div>
          </div>`;
      }
      if (q.type === 'order') {
        return `<div class="q">${esc(q.question)}</div>
          <p class="muted" style="margin-bottom:10px">Use the arrows to put these in the correct order.</p>
          ${val.map((t, k) => `<div class="oitem"><span class="num">${k + 1}</span><span class="txt">${esc(t)}</span>
            <button class="obtn" data-mv="up" data-i="${k}" ${k === 0 ? 'disabled' : ''}>▲</button>
            <button class="obtn" data-mv="dn" data-i="${k}" ${k === val.length - 1 ? 'disabled' : ''}>▼</button></div>`).join('')}`;
      }
      if (q.type === 'open') {
        return `<div class="q">${esc(q.question)}</div>
          <textarea class="oanswer" placeholder="Write your answer here…">${esc(val || '')}</textarea>
          <p class="muted" style="margin-top:6px">Answer in your own words — spelling doesn't have to be perfect. 🙂</p>`;
      }
      if (q.type === 'tf') {
        const pick = (val && val.pick) || '';
        return `<div class="q">${esc(q.question)}</div>
          <div id="opts">
            <button class="opt${pick === 'True' ? ' sel' : ''}" data-tf="True"><span class="tag">✓</span><span>True</span></button>
            <button class="opt${pick === 'False' ? ' sel' : ''}" data-tf="False"><span class="tag">✗</span><span>False</span></button>
          </div>
          ${q.explain ? `<textarea class="oanswer" placeholder="Why? Explain your choice…">${esc((val && val.why) || '')}</textarea>
          <p class="muted" style="margin-top:6px">Tell us why you chose that. ✍️</p>` : ''}`;
      }
      // mcq (default)
      return `<div class="q">${esc(q.question)}</div>
        <div id="opts">${(q.options || []).map((o, j) => `
          <button class="opt${val === LETTERS[j] ? ' sel' : ''}" data-l="${LETTERS[j]}">
            <span class="tag">${LETTERS[j]}</span><span>${esc(o)}</span>
          </button>`).join('')}</div>`;
    }

    function showQuestion() {
      const total = quiz.questions.length;
      const q = quiz.questions[current];
      const pct = Math.round((current / total) * 100);
      const last = current === total - 1;
      const chip = q.bloom ? `<span class="bloom" style="background:${BLOOM_COLORS[q.bloom] || '#64748b'}">${esc(q.bloom)}</span>` : '';

      card.innerHTML = `
        <div class="hello">Hi ${esc(quiz.name)} 👋</div>
        <div class="title">${esc(quiz.taskTitle)}</div>
        ${quiz.already ? `<div class="note">You already finished this task — this try is just for practice.</div>` : ''}
        <div class="bar"><div style="width:${pct}%"></div></div>
        <div class="step">Question ${current + 1} of ${total}</div>
        ${chip}
        ${mediaHtml(q)}
        ${bodyHtml(q, current)}
        <button class="btn" id="nextBtn" ${canGoNext(q, picked[current]) ? '' : 'disabled'}>
          ${last ? 'Finish ✅' : 'Next ➜'}</button>
        <div class="foot">QRAMS · scan code ${esc(token)}</div>`;

      wireQuestion(q);
      document.getElementById('nextBtn').onclick = () => {
        if (!canGoNext(q, picked[current])) return;
        mSel = -1;
        if (last) submit();
        else { current++; showQuestion(); }
      };
    }

    /** Hook up the interactions for the current question's activity type. */
    function wireQuestion(q) {
      const refresh = () => { document.getElementById('nextBtn').disabled = !canGoNext(q, picked[current]); };
      if (q.type === 'fill') {
        document.querySelectorAll('.fillin').forEach(inp => inp.oninput = () => {
          picked[current][Number(inp.dataset.b)] = inp.value;
          refresh();
        });
      } else if (q.type === 'match') {
        document.querySelectorAll('.mitem').forEach(b => b.onclick = () => {
          if (b.dataset.side === 'l') {
            const li = Number(b.dataset.i);
            if (mSel === li) { picked[current][li] = ''; mSel = -1; } // second tap clears the pair
            else mSel = li;
            showQuestion();
          } else if (mSel >= 0) {
            const t = b.dataset.t;
            const used = picked[current].indexOf(t);     // a right item pairs with one left only
            if (used >= 0) picked[current][used] = '';
            picked[current][mSel] = t;
            mSel = -1;
            showQuestion();
          }
        });
      } else if (q.type === 'order') {
        document.querySelectorAll('.obtn').forEach(b => b.onclick = () => {
          const i = Number(b.dataset.i), arr = picked[current];
          const j = b.dataset.mv === 'up' ? i - 1 : i + 1;
          if (j < 0 || j >= arr.length) return;
          const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
          showQuestion();
        });
      } else if (q.type === 'open') {
        const ta = document.querySelector('.oanswer');
        if (ta) ta.oninput = () => { picked[current] = ta.value; refresh(); };
      } else if (q.type === 'tf') {
        document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
          picked[current].pick = b.dataset.tf;
          document.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b));
          refresh();
        });
        const ta = document.querySelector('.oanswer');
        if (ta) ta.oninput = () => { picked[current].why = ta.value; refresh(); };
      } else { // mcq
        document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
          picked[current] = b.dataset.l;
          document.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b));
          refresh();
        });
      }
    }

    /* ------------------------------ 3. submit ------------------------------ */
    async function submit() {
      card.innerHTML = `<div class="center"><div class="big">🧮</div>
        <div class="title">Checking your answers…</div><div class="spin"></div></div>`;
      let r;
      const allMcq = quiz.questions.every(q => !q.type || q.type === 'mcq');
      try {
        // Structured answers (matching/fill/order) need a POST body.
        const res = await fetch(API, {
          method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'finishQuiz', playToken: token, answers: picked }),
        });
        r = await res.json();
        // Older backend without the POST route → letters-in-URL fallback (MCQ-only).
        if (!r.ok && /unknown post/i.test(r.error || '') && allMcq) {
          const res2 = await fetch(API + '?finish=' + encodeURIComponent(token) + '&a=' + encodeURIComponent(picked.join(',')));
          r = await res2.json();
        }
      } catch (e) { return fail('Could not send your answers. Check your internet and try again.'); }
      if (!r.ok) return fail(r.error || 'Something went wrong.');
      showResult(r.data);
    }

    /* ------------------------------ 4. result ------------------------------ */
    /* MASTERY MODE: keep trying until everything is correct.
       - Not all correct  → show WHICH ones are wrong (never the answers) + Try again.
       - All correct      → task complete, full points. 🎉
       - Played after that → practice round, no extra points.                       */
    function showResult(d) {
      // Not mastered yet → encourage + retry (answers stay secret).
      if (!d.mastered && !d.already) {
        card.innerHTML = `
          <div class="center">
            <div class="big">💪</div>
            <div class="title">Almost there!</div>
            <div class="score">${d.score} / ${d.max}</div>
            <p class="muted">Get ALL of them correct to finish this task.</p>
            <div class="review">
              <h3>Which ones to look at again</h3>
              ${d.review.map(v => `
                <div class="rev">
                  <span class="${v.ok ? 'ok' : 'bad'}">${v.ok ? '✓' : '✗'}</span>
                  <span>Q${v.qNo}${v.ok ? ' — correct!' : ' — try a different answer'}</span>
                </div>`).join('')}
            </div>
            <button class="btn" id="retryBtn" style="margin-top:16px">Try again 🔁</button>
            <p class="muted" style="margin-top:10px">Attempt ${d.attempts} · you can try as many times as you need.</p>
          </div>`;
        document.getElementById('retryBtn').onclick = () => {
          picked = freshPicked();
          current = 0;
          showQuestion();
        };
        return;
      }

      // Mastered (or practice round after mastery) → celebrate + full review.
      const tries = d.attempts || 1;
      card.innerHTML = `
        <div class="center">
          <div class="big">🎉</div>
          <div class="title">${d.already ? 'Practice complete!' : 'All correct — task complete!'}</div>
          <div class="score">${d.score} / ${d.max}</div>
          <div class="stars">⭐⭐⭐</div>
          ${d.already
            ? `<div class="note">Practice round — you already finished this task, so no extra points.</div>`
            : `<div class="pts">+${d.points} points</div>
               <p class="muted">${tries === 1 ? 'First try — superb! 🌟' : 'You did it in ' + tries + ' tries — well done for not giving up!'}</p>`}
          <div class="review">
            <h3>Your answers</h3>
            ${d.review.map(v => {
              let detail;
              if (v.model !== undefined) { // open answer
                detail = `<span>Q${v.qNo}: <b>${esc(v.your || '—')}</b></span>`
                  + (v.model ? `<div class="fix" style="font-size:.85rem">Sample answer: ${esc(v.model)}</div>` : '')
                  + (v.review ? `<div style="font-size:.8rem;color:#92400e">📝 Saved for your teacher to look at.</div>` : '');
              } else {
                detail = `<span>Q${v.qNo}: <b>${esc(v.your || '—')}</b>${v.ok || !v.correct ? '' :
                  ` · correct: <span class="fix">${esc(v.correct)}</span>`}</span>`;
              }
              return `<div class="rev"><span class="${v.ok ? 'ok' : 'bad'}">${v.ok ? '✓' : '✗'}</span><div>${detail}</div></div>`;
            }).join('')}
          </div>
          <div id="progBox" style="margin-top:14px"></div>
          <p class="muted" style="margin-top:14px">${d.already ? 'You can close this page. 👍' : 'Your result is saved. You can close this page. 👍'}</p>
        </div>`;
      loadProgress();
    }

    /** After finishing, show the pupil their points, tasks done, and badges. */
    async function loadProgress() {
      const box = document.getElementById('progBox');
      if (!box) return;
      try {
        const res = await fetch(API + '?prog=' + encodeURIComponent(token));
        const r = await res.json();
        const d = r && r.data;
        if (!r.ok || !d || !d.found) return;
        const badges = (d.badges || []).map(b =>
          `<span style="display:inline-block;background:#eef2ff;border:1px solid #c7d2fe;border-radius:99px;padding:4px 12px;margin:3px;font-weight:700;font-size:.85rem">${esc(b.icon)} ${esc(b.name)}</span>`).join('');
        box.innerHTML = `<div style="border-top:2px dashed #e2e8f0;padding-top:12px">
          <div style="font-weight:800;margin-bottom:8px">Your progress</div>
          <div style="display:flex;gap:10px;justify-content:center;margin-bottom:8px">
            <div style="background:#ecfeff;border:2px solid #a5f3fc;border-radius:14px;padding:8px 16px"><div style="font-size:1.4rem;font-weight:900;color:#0e7490">${d.points}</div><div class="muted" style="font-size:.78rem">points</div></div>
            <div style="background:#f0fdf4;border:2px solid #bbf7d0;border-radius:14px;padding:8px 16px"><div style="font-size:1.4rem;font-weight:900;color:#15803d">${d.completed}</div><div class="muted" style="font-size:.78rem">tasks done</div></div>
          </div>
          ${badges ? `<div>${badges}</div>` : ''}
        </div>`;
      } catch (e) {}
    }

    load();
  </script>
</body>
</html>
