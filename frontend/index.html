<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>QRAMS — QR Task Splitter & Tracking</title>
  <meta name="description" content="Split one task link into many tracked QR codes for your pupils." />
  <meta name="theme-color" content="#0e1d3c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="QRAMS" />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <!-- Bootstrap 5 + Icons (cached by the service worker for offline use) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="./css/styles.css" rel="stylesheet" />
</head>
<body>

  <!-- =================== LOGIN SCREEN =================== -->
  <div id="loginView" class="login-wrap d-none">
    <div class="login-card card shadow-lg">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <img src="./icons/icon-512.png" alt="QRAMS logo" class="brand-img mb-3" width="120" height="120" />
          <h1 class="h4 fw-bold mb-1 visually-hidden">QRAMS</h1>
          <p class="text-secondary small mb-0">QR Task Splitter &amp; Tracking System</p>
        </div>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Email</label>
            <input type="email" class="form-control" id="loginEmail" value="admin@school.edu" required />
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">PIN</label>
            <input type="password" class="form-control" id="loginPin" value="1234" required />
          </div>
          <button class="btn btn-primary w-100" type="submit">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign in
          </button>
          <p class="text-secondary small text-center mt-3 mb-0">
            First time? Set your API URL in
            <a href="#" id="loginConfigLink">connection settings</a>.
          </p>
        </form>
      </div>
    </div>
  </div>

  <!-- =================== APP SHELL =================== -->
  <div id="appShell" class="d-none">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="./icons/icon-192.png" alt="" class="brand-img-sm" width="34" height="34" />
        <span class="brand-text">QRAMS</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#/dashboard" data-route="dashboard"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
        <a href="#/tasks" data-route="tasks"><i class="bi bi-list-check"></i><span>Tasks</span></a>
        <a href="#/generator" data-route="generator"><i class="bi bi-qr-code"></i><span>QR Generator</span></a>
        <a href="#/students" data-route="students"><i class="bi bi-people"></i><span>Students</span></a>
        <a href="#/import" data-route="import"><i class="bi bi-upload"></i><span>Bulk Import</span></a>
        <a href="#/analytics" data-route="analytics"><i class="bi bi-graph-up"></i><span>Analytics</span></a>
        <a href="#/settings" data-route="settings"><i class="bi bi-gear"></i><span>Settings</span></a>
      </nav>
      <div class="sidebar-foot small text-secondary px-3">v1.0 · Phase 1</div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="btn btn-sm btn-ghost d-lg-none" id="menuBtn"><i class="bi bi-list fs-5"></i></button>
        <div class="topbar-title" id="pageTitle">Dashboard</div>
        <div class="ms-auto d-flex align-items-center gap-2">
          <span class="badge rounded-pill text-bg-light d-none d-sm-inline" id="schoolBadge">My School</span>
          <button class="btn btn-sm btn-ghost" id="themeBtn" title="Toggle theme"><i class="bi bi-moon-stars"></i></button>
          <div class="dropdown">
            <button class="btn btn-sm btn-ghost dropdown-toggle" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle me-1"></i><span id="userName">User</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><span class="dropdown-item-text small text-secondary" id="userRole">role</span></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#/settings"><i class="bi bi-gear me-2"></i>Settings</a></li>
              <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Sign out</a></li>
            </ul>
          </div>
        </div>
      </header>

      <main class="content" id="view"><!-- rendered by app.js --></main>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts" style="z-index:1100"></div>

  <!-- Generic modal -->
  <div class="modal fade" id="appModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content" id="appModalContent"></div>
    </div>
  </div>

  <!-- Libraries (cached offline by the service worker) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <!-- App code -->
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/qr.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
