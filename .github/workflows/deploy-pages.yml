# Publishes the QRAMS frontend (the frontend/ folder) to GitHub Pages.
# One-time setup: Repo ▸ Settings ▸ Pages ▸ Build and deployment ▸ Source = "GitHub Actions".
# After that, every push to main auto-deploys. Site URL: https://<user>.github.io/QRAMS/
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload frontend as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
